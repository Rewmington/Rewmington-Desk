name = "desk-content-admin"
main = "worker/index.js"
compatibility_date = "2026-09-01"

# 后台页面本身是静态资源，只有 Worker 显式 fetch 的 ui.html 会被吐出去。
# 这个目录由 npm run deploy:admin 从 tools/studio/ui.html 复制生成，不入库。
[assets]
directory = "./worker/assets"
binding = "ASSETS"
# 默认是"先匹配静态资源再进 Worker"，而 /admin/* 这条路由下没有任何资源，
# 只会产生警告并多一次无意义匹配。让 Worker 先跑，由它决定回什么。
run_worker_first = true

# 部署时 wrangler 会直接在 wmddd.online 这个 zone 上建/更新这两条路由。
# 两条是必要的：`/admin/*` 不保证匹配不带斜杠的 `/admin`。
# 只想先看看不真部署：npx wrangler deploy --dry-run
[[routes]]
pattern = "wmddd.online/admin/*"
zone_name = "wmddd.online"

[[routes]]
pattern = "wmddd.online/admin"
zone_name = "wmddd.online"
